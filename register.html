<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تسجيل حساب جديد</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;}
  .box{max-width:420px;margin:60px auto;background:#fff;padding:30px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
  .box h2{margin-top:0}
  .box input{width:100%;padding:10px;margin-bottom:12px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box}
  .box button{width:100%;padding:10px;background:#2e8b57;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:16px}
  .msg{padding:10px;border-radius:4px;margin-bottom:12px;display:none}
  .err{background:#fdecea;color:#b00020}
  .ok{background:#e6f4ea;color:#137333}
  .box a{display:block;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="box">
  <h2>تسجيل حساب جديد</h2>
  <div id="message" class="msg"></div>
  <form id="registerForm">
    <input type="text" id="nom" placeholder="الاسم الكامل" required>
    <input type="email" id="email" placeholder="البريد الإلكتروني" required>
    <input type="password" id="password" placeholder="كلمة السر (6 حروف على الأقل)" required minlength="6">
    <input type="text" id="tel" placeholder="الهاتف (اختياري)">
    <button type="submit">إنشاء الحساب</button>
  </form>
  <a href="login.html">عندك حساب من قبل؟ دخول</a>
  <a href="index.htm">الرجوع للموقع</a>
</div>

<script>
const form = document.getElementById("registerForm");
const messageBox = document.getElementById("message");

function showMessage(text, type) {
  messageBox.textContent = text;
  messageBox.className = "msg " + type;
  messageBox.style.display = "block";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const nom = document.getElementById("nom").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const tel = document.getElementById("tel").value;

  const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password,
    options: {
      data: { full_name: nom, phone: tel }
    }
  });

  if (error) {
    showMessage("خطأ: " + error.message, "err");
  } else {
    showMessage("تم إنشاء الحساب بنجاح! كتوجه للوحة الحساب...", "ok");
    setTimeout(() => { window.location.href = "account.html"; }, 1500);
  }
});
</script>
</body>
</html>
