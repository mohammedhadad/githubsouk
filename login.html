<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تسجيل الدخول</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;}
  .box{max-width:380px;margin:80px auto;background:#fff;padding:30px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
  .box h2{margin-top:0}
  .box input{width:100%;padding:10px;margin-bottom:12px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box}
  .box button{width:100%;padding:10px;background:#2e6da4;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:16px}
  .msg{padding:10px;border-radius:4px;margin-bottom:12px;display:none}
  .err{background:#fdecea;color:#b00020}
  .ok{background:#e6f4ea;color:#137333}
  .box a{display:block;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="box">
  <h2>تسجيل الدخول</h2>
  <div id="message" class="msg"></div>
  <form id="loginForm">
    <input type="email" id="email" placeholder="البريد الإلكتروني" required>
    <input type="password" id="password" placeholder="كلمة السر" required>
    <button type="submit">دخول</button>
  </form>
  <a href="register.html">ماعندكش حساب؟ سجل واحد جديد</a>
  <a href="index.htm">الرجوع للموقع</a>
</div>

<script>
const form = document.getElementById("loginForm");
const messageBox = document.getElementById("message");

function showMessage(text, type) {
  messageBox.textContent = text;
  messageBox.className = "msg " + type;
  messageBox.style.display = "block";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if (error) {
    showMessage("خطأ: " + error.message, "err");
  } else {
    window.location.href = "account.html";
  }
});
</script>
</body>
</html>
